<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    button {
      display: grid; place-items: center;
      width: 40px; height: 40px; padding: 0; border: 1px solid rgba(138, 138, 144, .3);
      border-radius: 8px; background: transparent; color: #8a8a90; cursor: pointer;
      transition: background-color .15s cubic-bezier(.22, 1, .36, 1), color .15s cubic-bezier(.22, 1, .36, 1);
    }
    button:hover { background: rgba(138, 138, 144, .12); color: #dc2a46; }
    button.listening { color: #dc2a46; }
    button:disabled { cursor: wait; opacity: .7; }
  </style>
</head>
<body>
  <button type="button" aria-label="Speak your craving" title="Speak your craving"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg></button>
  <script>
    const button = document.querySelector("button");
    const micIcon = button.innerHTML;
    const send = (value) => window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value
    }, "*");

    button.addEventListener("click", () => {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) {
        send({ error: "Speech recognition is not supported by this browser." });
        return;
      }

      const recognition = new Recognition();
      recognition.lang = navigator.language || "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      button.disabled = true;
      button.classList.add("listening");

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) send(transcript);
      };
      recognition.onerror = (event) => {
        const message = event.error === "not-allowed"
          ? "Allow microphone access to use voice input."
          : "Voice input could not be completed. Please try again.";
        send({ error: message });
      };
      recognition.onend = () => {
        button.disabled = false;
        button.classList.remove("listening");
        button.innerHTML = micIcon;
      };
      recognition.start();
    });

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: 42
    }, "*");
  </script>
</body>
</html>
